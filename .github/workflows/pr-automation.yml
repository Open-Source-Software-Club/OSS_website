# ==============================================================================
# Pull-request automation — labels from the diff
#
# Docs: docs/CI_CD.md · docs/GITHUB_INTEGRATION.md §6.2
#
# The label taxonomy is the input to the website's difficulty / area / type
# filters. Keeping it accurate by hand does not survive a busy semester;
# deriving it from the paths a pull request touches does.
#
# WHY `pull_request_target` AND HOW IT IS KEPT SAFE
#   Labelling needs `pull-requests: write`, which the `pull_request` trigger
#   only grants to branches in this repository — a fork's pull request would
#   arrive read-only, and most contributions come from forks. `pull_request_target`
#   runs in the base repository's context, so the write token is available.
#
#   The cost is that a `pull_request_target` workflow with a write token will
#   happily execute code from the fork if it checks it out. That is the
#   "pwn request" pattern, and it is why this workflow checks out NOTHING:
#
#     * `actions/labeler` finds no local configuration and fetches
#       .github/labeler.yml through the API at `github.context.sha`, which under
#       `pull_request_target` is the head of the BASE branch — reviewed, merged
#       code. A fork cannot label its own pull request `priority: critical` or
#       teach the labeler anything.
#     * the title step reads the payload; no file from any commit is read.
#
#   It used to check out the base commit. That was safe, but Scorecard
#   (Dangerous-Workflow) flags every checkout under `pull_request_target`, and
#   a checkout that is never needed is attack surface for no benefit. The
#   labeler.yml schema check now runs in CI's Repository Hygiene job, on the
#   pull request that changes the file — before the change merges.
#
#   `docs/CI_CD.md` §4.9 and §10 state the rule this workflow follows: untrusted
#   values are never interpolated into a `run:` block, and untrusted code is
#   never run with a write token.
# ==============================================================================

name: PR Automation

# `labeled`/`unlabeled` are deliberately absent. With `sync-labels: true` the
# labeler removes every path label whose files the PR does not touch, so
# re-running it on a label change instantly stripped any area label a
# maintainer had just added by hand. `edited` is present so that fixing the
# title re-applies the matching "type:" label.
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Apply labels from the diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # add and remove labels
    timeout-minutes: 10
    steps:
      - name: Apply labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      # actions/labeler v5 removed `title:` matching, and release-drafter groups
      # release notes by exactly these labels. The pull-request title is already
      # required to be a Conventional Commit header by "PR Conventions", so the
      # mapping is a lookup rather than a guess.
      #
      # The title is read from `context.payload` inside the script and never
      # interpolated through `${{ }}`: a title is contributor-controlled text.
      - name: Apply labels from the Conventional Commit title
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const map = [
              [/^feat(\(.+\))?!?:/i, 'type: feature'],
              [/^fix(\(.+\))?!?:/i, 'type: bug'],
              [/^docs(\(.+\))?!?:/i, 'type: docs'],
              [/^refactor(\(.+\))?!?:/i, 'type: refactor'],
              [/^(chore|build|ci|perf|test|style)(\(.+\))?!?:/i, 'type: maintenance'],
            ];

            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull request in the payload; nothing to label.');
              return;
            }

            const title = pr.title || '';
            const wanted = map.filter(([re]) => re.test(title)).map(([, label]) => label);
            if (wanted.length === 0) {
              core.info(`Title does not match a Conventional Commit type: ${title}`);
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const current = (pr.labels || []).map((label) => label.name);
            const toAdd = wanted.filter((label) => !current.includes(label));
            if (toAdd.length === 0) {
              core.info('Title labels are already present.');
              return;
            }

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            core.info(`Applied ${toAdd.join(', ')} from the title.`);
