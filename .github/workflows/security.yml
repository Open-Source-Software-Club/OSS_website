# ==============================================================================
# Security — credential scanning and dependency review
#
# Docs: docs/CI_CD.md
#
# Two required checks live here:
#   * Secret Scan        — dependency-free content scan of every tracked file,
#                          plus an optional full-history Gitleaks sweep.
#   * Dependency Review  — blocks new vulnerable or badly licensed dependencies
#                          from entering through a pull request.
# ==============================================================================

name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly sweep: catches secrets that were pushed before a rule existed and
    # vulnerabilities disclosed after a dependency was merged.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Required check: "Secret Scan"
  #
  # Runs the same script as .githooks/pre-commit, so the local experience and
  # the CI experience cannot drift apart. Always runs, always conclusive.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    # Job-scoped, because the workflow is otherwise read-only. Gitleaks comments
    # on the pull request (pull-requests: write). It does NOT need
    # `security-events: write`: gitleaks-action uploads its SARIF as a workflow
    # artifact, not to code scanning, so that grant was unused write access
    # (Scorecard Token-Permissions).
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    # When set as a repository secret, the full-history Gitleaks sweep is
    # enabled. The bash scanner below is the gate and needs no configuration.
    #
    # Job-scoped, not workflow-wide: at workflow level the licence was in the
    # environment of every step in this file, including the dependency-review
    # job that used to run `pnpm install` — i.e. every install script of every
    # package a pull request added could read it.
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # Scanning only needs the working tree and history, never a push.
          persist-credentials: false

      - name: Scan tracked files for credentials
        run: bash scripts/checks/check-secrets.sh --strict

      - name: Scan full git history with Gitleaks
        if: ${{ env.GITLEAKS_LICENSE != '' }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_CONFIG: .github/gitleaks.toml

      - name: Report history-scan status
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        run: |
          echo "::notice::GITLEAKS_LICENSE is not configured, so the full-history Gitleaks sweep is disabled. The tracked-file scan above still ran. Enable GitHub secret scanning and push protection for defence in depth (see docs/CI_CD.md)."

      - name: Verify no secret material is present in tracked file names
        run: |
          # A private key is a secret even if the scanner cannot read it.
          suspicious="$(git ls-files | grep -Ei '(\.pem$|\.key$|\.p12$|\.pfx$|(^|/)id_rsa|(^|/)id_ed25519|\.jks$|\.keystore$)' || true)"
          if [ -n "$suspicious" ]; then
            echo "::error::Private key or certificate files are tracked by git:"
            echo "$suspicious"
            exit 1
          fi
          echo "No private key material in tracked file names."

  # ---------------------------------------------------------------------------
  # Required check: "Dependency Review"
  #
  # Only runs on pull requests — there is no diff to review on a push.
  #
  # Two things gate this job, and both are reported as notices rather than
  # skips, because a skipped check cannot be a required status check:
  #
  #   1. There must be a dependency manifest. Until Phase 0 scaffolding lands
  #      there are literally no dependencies to review.
  #   2. The GitHub dependency graph must be enabled. When it is not, the
  #      action fails with an opaque "not supported on this repository" error,
  #      so we check first and say exactly what to enable and where.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # `comment-summary-in-pr: always` posts the summary on the pull request,
    # which the default read-only token cannot do.
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Detect a dependency manifest
        id: detect
        run: |
          if [ -f package.json ] || [ -f pnpm-lock.yaml ]; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "deps=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json yet — there are no dependencies to review. This check activates automatically when Phase 0 scaffolding lands."
          fi

      - name: Verify the dependency graph is enabled
        if: steps.detect.outputs.deps == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The SBOM endpoint returns 404 when the dependency graph is off,
          # which actions/dependency-review-action reports as "Dependency
          # review is not supported on this repository". Checking first turns
          # that into one actionable sentence.
          if ! gh api "repos/${{ github.repository }}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "::error::The GitHub dependency graph is disabled for this repository, so 'Dependency Review' cannot run. Enable it at Settings → Code security → Dependency graph."
            exit 1
          fi
          echo "Dependency graph is enabled."

      - name: Review dependency changes
        if: steps.detect.outputs.deps == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: 'AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later'
          comment-summary-in-pr: always

      # `pnpm audit` reads pnpm-lock.yaml; it does not need node_modules. The
      # `pnpm install` that used to precede it downloaded the whole tree and ran
      # the install scripts of every dependency the pull request added — slow,
      # and the one thing a dependency review should never do.
      # Version from package.json's `packageManager`; see ci.yml.
      - name: Install pnpm
        if: steps.detect.outputs.deps == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Audit the dependency tree
        if: steps.detect.outputs.deps == 'true'
        run: |
          # High and critical only: this is a student club website, and blocking
          # a contribution over a low-severity transitive advisory helps nobody.
          # A failure here is a warning, not a merge blocker, because the
          # Dependency Review action above is the authoritative gate.
          pnpm audit --audit-level high || {
            echo "::warning::'pnpm audit' reported high or critical advisories. Update the dependency or document the exception."
          }
