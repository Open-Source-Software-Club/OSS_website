# ==============================================================================
# Database migrations — production, with human approval
#
# Docs: docs/CI_CD.md · docs/GITHUB_WORKFLOW.md
#
# "Database migrations: applied to prod by a manual-approval workflow
#  (supabase db push) — never auto from PR."
#
# This is the only workflow in the repository that can change production data.
# It is therefore gated three ways:
#   1. It can only be started from a protected environment (see below).
#   2. The environment requires a reviewer with write access.
#   3. It refuses to run on a pull request, ever.
#
# The environment is created by .github/branch-protection/apply.sh.
# ==============================================================================

name: Migrate Production Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [production, staging]
        required: true
        default: production
      confirm:
        description: 'Type MIGRATE to confirm you have reviewed the pending migrations'
        type: string
        required: true

# One migration per DATABASE at a time, not per branch: keyed on github.ref, two
# dispatches from different branches could run `supabase db push` against the
# same production database concurrently.
concurrency:
  group: db-migrate-${{ inputs.environment }}
  cancel-in-progress: false

env:
  # Keep in step with db-check.yml, which is the workflow that proves the
  # migrations apply cleanly.
  SUPABASE_CLI_VERSION: '3.1.0'

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_apply: ${{ steps.check.outputs.should_apply }}
    steps:
      # The trigger list contains only `workflow_dispatch`, so a pull request
      # cannot start this workflow at all. That is the preventive control; a
      # "refuse to run from a pull request" step would be unreachable code.
      # `workflow_dispatch` can be started from ANY branch, so without this the
      # migrations applied to production would be whatever an unmerged branch
      # contains — exactly the "auto from PR" this workflow exists to prevent.
      # The Production environment's deployment-branch policy is the second
      # line of defence; this one fails in seconds with a sentence that says why.
      - name: Require explicit confirmation and a reviewed ref
        id: check
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET: ${{ inputs.environment }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$CONFIRM" != "MIGRATE" ]; then
            echo "should_apply=false" >> "$GITHUB_OUTPUT"
            echo "::error::You must type MIGRATE to confirm. Review the pending migrations first."
            exit 1
          fi
          if [ "$TARGET" = 'production' ] && [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "should_apply=false" >> "$GITHUB_OUTPUT"
            echo "::error::Production migrations must be run from '$DEFAULT_BRANCH', not '$REF'. Only reviewed, merged migrations may reach production."
            exit 1
          fi
          echo "should_apply=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Show the migrations that are about to be applied
        run: |
          echo "Pending migration files:"
          ls -1 supabase/migrations/*.sql 2>/dev/null || echo "  (none)"
          echo
          echo "Reminder: destructive statements (DROP, TRUNCATE, ALTER TYPE) are"
          echo "irreversible in production. Take a backup before continuing."

  apply:
    name: Apply migrations (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_apply == 'true'
    # The environment name is what routes this job to the required reviewers
    # configured in repository settings.
    environment:
      name: ${{ inputs.environment }}
      # An empty or relative URL makes the environment invalid and fails the job
      # before the first step runs, so the fallback is part of the expression
      # rather than something a maintainer has to remember to configure.
      url: ${{ vars.SITE_URL || format('https://github.com/{0}', github.repository) }}
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Same version as db-check.yml: the migration is applied by the CLI that
      # was tested against the migration.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link to the target project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF must all be configured for the '${{ inputs.environment }}' environment."
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify the migration history is consistent
        run: |
          count="$(ls -1 supabase/migrations/*.sql 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo "::error::No migration files found — nothing to apply."
            exit 1
          fi
          echo "Applying $count migration file(s)."

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Trigger a full reconcile
        if: env.SITE_URL != ''
        run: |
          # Migrations can change the shape of cached data; force a full
          # re-sync so the site never serves rows written against the old
          # schema.
          curl --silent --show-error --fail \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/reconcile?force=1" || \
            echo "::warning::Post-migration reconcile failed. Trigger it manually from /admin/github."
