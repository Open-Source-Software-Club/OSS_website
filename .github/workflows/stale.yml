# ==============================================================================
# Housekeeping — stale pull requests and branches
#
# Docs: docs/CI_CD.md
#
# A club repository accumulates abandoned forks' branches and half-finished
# pull requests faster than any other kind of clutter. Both cost real attention:
# every open PR is something a maintainer must evaluate before merging anything
# else, and Vercel builds a preview deployment for each one.
#
# CONTRIBUTING.md already sets the expectation for issues ("Inactivity Policy:
# 7 days"). This workflow applies the same courtesy to pull requests and
# branches, with a longer grace period because a student's semester is not a
# sprint.
# ==============================================================================

name: Housekeeping

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Least privilege at the workflow level; the jobs below widen only what they
# touch. `contents: read` is the default for both.
permissions:
  contents: read

jobs:
  stale-pull-requests:
    name: Stale pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Mark and close inactive pull requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Only pull requests: issues are triaged by humans and a bot closing
          # a newcomer's question is a terrible first experience.
          #
          # The issue settings must be explicit. actions/stale applies
          # `days-before-stale` (default 60) and `days-before-close` (default 7)
          # to issues unless told otherwise, so with only the PR settings below
          # every issue would have been marked stale after 60 days and closed a
          # week later.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-message: >
            This pull request has had no activity for 30 days. It will be
            closed in 14 days unless it is updated. If you are still working on
            it, push a commit or comment here — that is all it takes to keep it
            open. If someone else has picked up the issue, that is fine too;
            just let us know so we can close this one.
          close-pr-message: >
            Closed after 44 days of inactivity. Nothing was wrong with this
            work — we simply cannot review a change we cannot see the current
            state of. Please open a fresh pull request whenever you pick this
            up again; it will get a full review.
          stale-pr-label: 'stale'
          # Never touch anything a maintainer has already looked at.
          exempt-pr-labels: 'priority: critical,priority: high,blocked,security'

  merged-branches:
    name: Delete merged branches
    runs-on: ubuntu-latest
    permissions:
      # Deleting a ref is a write. The previous version of this job inherited a
      # read-only token, so every deleteRef call failed with 403 and the branch
      # was silently kept.
      contents: write
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Delete branches whose pull request has been merged
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // Belt and braces for "Automatically delete head branches" in the
            // repository settings, which misses branches orphaned by a merge
            // performed outside the pull request UI.
            //
            // A branch is deleted only when nothing on it would be lost: no
            // open pull request uses it, and its tip is exactly the head of the
            // pull request that was merged. A branch that gained commits after
            // the merge — a follow-up someone is still working on — is kept.
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const merged = [];
            for (const branch of branches) {
              if (branch.name === context.payload.repository.default_branch) continue;
              if (branch.protected) continue;
              try {
                const head = `${owner}:${branch.name}`;
                const { data: open } = await github.rest.pulls.list({
                  owner, repo, head, state: 'open', per_page: 1,
                });
                if (open.length > 0) continue;

                const { data: prs } = await github.rest.pulls.list({
                  owner, repo, head, state: 'closed', per_page: 1,
                });
                const pr = prs[0];
                if (!pr || !pr.merged_at) continue;
                if (pr.head.sha !== branch.commit.sha) {
                  core.info(`Keeping ${branch.name}: it has commits that were not in #${pr.number}.`);
                  continue;
                }

                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
                merged.push(branch.name);
                core.info(`Deleted ${branch.name} (merged in #${pr.number})`);
              } catch (error) {
                core.warning(`Could not process branch ${branch.name}: ${error.message}`);
              }
            }
            core.summary.addRaw(`## Merged branch cleanup\n\nDeleted ${merged.length} merged branch(es).\n`);
            await core.summary.write();
