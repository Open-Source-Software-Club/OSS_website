# ==============================================================================
# CodeQL — static analysis for security-relevant defects
#
# Docs: docs/CI_CD.md
#
# CodeQL finds the classes of bug that linting and tests miss: injection,
# unsafe deserialisation, prototype pollution, credential flow into sinks.
# Runs on every pull request that touches application code, on every push to
# main, and on a weekly schedule so newly published queries still see old code.
# ==============================================================================

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only at the top; the one write scope is granted to the job that uploads
# results. A workflow-level write grant reaches every job added here later.
permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the analysis to the Security tab
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Detect application toolchain
        id: detect
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CodeQL will analyse the application once package.json and pnpm-lock.yaml exist."
          fi

      # v4 is the current major (Node 24 runtime); v3 still works but is on the
      # Node 20 deprecation path.
      #
      # JavaScript/TypeScript is analysed from source: `build-mode: none` is the
      # mode CodeQL uses for it, and the Autobuild step that used to follow had
      # nothing to build.
      - name: Initialise CodeQL
        if: steps.detect.outputs.app == 'true'
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL analysis
        if: steps.detect.outputs.app == 'true'
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
