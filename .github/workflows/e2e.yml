# ==============================================================================
# End-to-end tests — Playwright
#
# Docs: docs/CI_CD.md
#
# Unit tests prove the units work. E2E proves the product works: that a visitor
# can reach the homepage, that a beginner can filter issues, that a form
# submits. These are the tests that catch the regressions a reviewer cannot see
# by reading a diff.
#
# Roadmap MVP acceptance criterion: "All P0 stories pass E2E".
# ==============================================================================

name: E2E

# The suite runs on every change except documentation. It used to be filtered
# to tests/e2e/** and the Playwright config, which meant a change to the
# application itself — the thing E2E exists to protect — never ran it.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  playwright:
    name: End-to-End Tests
    # Pinned rather than ubuntu-latest: ubuntu-latest moved to 26.04, and
    # Playwright 1.55 cannot install Chromium's system dependencies there
    # ("Playwright does not support chromium on ubuntu26.04-x64"), which failed
    # every E2E run on #58. Move back to ubuntu-latest once the Playwright
    # version in package.json lists 26.04 as supported.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Detect the Playwright suite
        id: detect
        run: |
          if [ -f playwright.config.ts ] || [ -f playwright.config.js ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Playwright configuration yet. E2E checks will activate when tests/e2e lands (Phase 7)."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.e2e == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      # Version from package.json's `packageManager`; see ci.yml.
      - name: Install pnpm
        if: steps.detect.outputs.e2e == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        if: steps.detect.outputs.e2e == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.detect.outputs.e2e == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the application
        if: steps.detect.outputs.e2e == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SKIP_ENV_VALIDATION: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build

      - name: Run the Playwright suite
        if: steps.detect.outputs.e2e == 'true'
        # Resolved through run-script.sh so either `e2e` or `test:e2e` works, and
        # so a genuine test failure can never be mistaken for a missing script.
        run: bash scripts/ci/run-script.sh 'e2e|test:e2e'

      - name: Upload the Playwright report
        if: always() && steps.detect.outputs.e2e == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
