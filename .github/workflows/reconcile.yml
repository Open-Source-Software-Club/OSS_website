# ==============================================================================
# GitHub data reconcile — the scheduled fallback sync
#
# Docs: docs/CI_CD.md · docs/GITHUB_INTEGRATION.md §6.3
#
# Webhooks are the fast path (≤ 1 minute). They are not the reliable path:
# GitHub redelivers, but a deployment can miss a window, an event can be
# dropped, or a repository can be created while the app is down. Reconcile is
# the safety net that makes the cache correct within 15 minutes no matter what.
#
# "Reconcile endpoint + scheduler + sync_state — Idempotent; handles rate
#  limits; updates sync_state."
#
# GitHub Actions is the scheduler because Vercel Cron frequency depends on the
# plan. Actions is free and its minimum interval is 5 minutes.
# ==============================================================================

name: Reconcile

on:
  schedule:
    # Every 15 minutes, matching the documented freshness target for issues
    # and pull requests.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a full re-sync instead of an incremental one'
        type: boolean
        default: false

concurrency:
  group: reconcile
  # Never cancel a running reconcile: a partial sync leaves the cache
  # half-updated, which is worse than a late one.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile GitHub cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The schedule fires 96 times a day. Until the site is deployed there is
    # nothing to reconcile, so skip at the job level — no runner is allocated —
    # instead of booting a VM every 15 minutes to print a notice. `vars` is
    # available here; `secrets` is not, so CRON_SECRET is still checked below.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SITE_URL != '' || vars.NEXT_PUBLIC_SITE_URL != '' }}
    # Resolved once here rather than repeated in every step. `vars` and
    # `secrets` are not available in every context an `if:` can appear in, so
    # they are bound to the environment and read from there.
    env:
      SITE_URL: ${{ vars.SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      FORCE: ${{ inputs.force || false }}
    steps:
      - name: Check the deployment is configured
        id: config
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SITE_URL or CRON_SECRET is not configured — the reconcile scheduler is idle. Set them once the application is deployed."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the reconcile endpoint
        if: steps.config.outputs.enabled == 'true'
        run: |
          # --fail-with-body makes a non-2xx response fail the job so a broken
          # sync is visible in the Actions history instead of silently going
          # stale, while still keeping the response body for the log.
          # --retry rides out a cold start or a transient 5xx.
          #
          # The HTTP status and the exit code are captured separately: when
          # curl fails before a response arrives (DNS, TLS, timeout) there is no
          # status at all.
          #
          # `|| rc=$?` is load-bearing. Steps run under `bash -e`, so a bare
          # `code="$(curl ...)"` followed by `rc=$?` exits the step the moment
          # curl fails, and the diagnostics below were never printed.
          query=''
          if [ "$FORCE" = 'true' ]; then
            query='?force=1'
          fi

          rc=0
          code="$(curl --silent --show-error --fail-with-body \
                      --retry 3 --retry-delay 5 --retry-all-errors \
                      --max-time 120 \
                      --header "Authorization: Bearer $CRON_SECRET" \
                      --write-out '%{http_code}' \
                      --output /tmp/reconcile.json \
                      "$SITE_URL/api/cron/reconcile$query" 2>/tmp/reconcile.err)" || rc=$?

          if [ "$rc" -ne 0 ]; then
            echo "::error::Reconcile request failed (curl exit $rc, HTTP ${code:-no response})."
            echo "--- response body ---"
            cat /tmp/reconcile.json 2>/dev/null || true
            echo "--- curl diagnostics ---"
            cat /tmp/reconcile.err 2>/dev/null || true
            exit 1
          fi

          echo "Reconcile completed with HTTP $code."
          cat /tmp/reconcile.json 2>/dev/null || true

      - name: Report the cache freshness
        if: steps.config.outputs.enabled == 'true'
        run: |
          # A stale cache is the failure mode users actually notice: the site
          # shows "Updated 3 h ago" and issues that were claimed days ago still
          # look available. Surface it rather than waiting for a complaint.
          status="$(curl --silent --max-time 30 "$SITE_URL/api/health/sync" || true)"
          echo "Sync health: $status"
          if printf '%s' "$status" | grep -Eq '"stale"[[:space:]]*:[[:space:]]*true'; then
            echo "::warning::The GitHub cache is stale. Investigate sync_state.last_error and the webhook delivery log."
          fi
