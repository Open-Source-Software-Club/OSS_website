# ==============================================================================
# .github/zizmor.yml
#
# Configuration for the "Workflow Security" check (.github/workflows/workflow-security.yml).
#
# zizmor's defaults are deliberately strict. Where this file departs from them
# it records *why*: every entry below is a reviewed decision, not a silence.
#
# Docs: docs/CI_CD.md §4.9
# Reference: https://docs.zizmor.sh/configuration/
# ==============================================================================

rules:
  # ----------------------------------------------------------------------------
  # unpinned-uses
  #
  # Every action is pinned to a full commit SHA, with the release it
  # corresponds to in a trailing comment:
  #
  #     uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
  #
  # A tag can be moved by whoever controls the action's repository, so a tag
  # pin runs whatever that tag points at today; a SHA cannot change. This is
  # what OpenSSF Scorecard's Pinned-Dependencies check measures.
  #
  # The two objections that once kept this repository on tags no longer hold:
  # Dependabot (.github/dependabot.yml, github-actions ecosystem) updates SHA
  # pins and rewrites the version comment alongside, so upgrades still arrive as
  # reviewed pull requests; and the comment makes the diff readable — a reviewer
  # sees `# v5.1.0` → `# v5.2.0`, not two opaque hashes.
  #
  # "hash-pin" is zizmor's default; it is stated here so the policy is explicit
  # and a later "simplify to tags" change has to delete a documented decision.
  # ----------------------------------------------------------------------------
  unpinned-uses:
    config:
      policies:
        "*": hash-pin

  # ----------------------------------------------------------------------------
  # dangerous-triggers
  #
  # `pull_request_target` is required to label, or reply to, pull requests that
  # arrive from forks — a `pull_request` trigger gives a fork's pull request a
  # read-only token. Both workflows below are safe for the same reason: they
  # check out nothing and run no code from the contribution.
  #
  #   pr-automation.yml — the labeler fetches its rules from the base branch
  #                       through the API; full reasoning in its header.
  #   welcome.yml       — posts fixed text on a first pull request.
  #
  #   issue-claims.yml  — `issue_comment`, for the `/assign` and `/unassign`
  #                       commands. It also checks out nothing; the comment is
  #                       read from `context.payload` inside JavaScript and never
  #                       interpolated into a script or shell, and it can only
  #                       assign the commenter to the issue they commented on.
  #
  # Any NEW workflow on these triggers must be reviewed against the same rule
  # and added here explicitly; a blanket ignore would hide the next mistake.
  # ----------------------------------------------------------------------------
  dangerous-triggers:
    ignore:
      - pr-automation.yml
      - welcome.yml
      - issue-claims.yml
