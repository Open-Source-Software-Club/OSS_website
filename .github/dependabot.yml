# ==============================================================================
# Dependabot — automated dependency and action updates
#
# Docs: docs/CI_CD.md · docs/PRD.md §8 ("Dependabot + pnpm audit in CI")
#
# Security patches must arrive without waiting for a volunteer to notice them.
# Dependabot opens the pull request; CI is what decides whether it is safe.
#
# Grouping: packages that must move together (Next.js + React + TypeScript,
# Tailwind + PostCSS, the test runners) share one PR each; everything else lands
# in its own PR, so a single bad transitive dependency never blocks a security
# fix.
#
# commit-message: Dependabot inserts the ':' after `prefix` itself, which with
# `include: scope` produces "chore(deps): bump …". There is no
# `prefix-separator` option — it used to be set here, and an unknown key makes
# Dependabot reject the whole file, which is why no Dependabot run or pull
# request ever appeared.
# ==============================================================================

version: 2

updates:
  # ----------------------------------------------------------------------------
  # npm dependencies
  # ----------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: 'Asia/Kolkata'
    open-pull-requests-limit: 5
    target-branch: main
    labels:
      - dependencies
      - 'type: maintenance'
    commit-message:
      prefix: chore
      include: scope
    versioning-strategy: increase
    groups:
      # A coordinated Next.js + React + TypeScript bump is one upgrade, not
      # three. Everything else stays individual so a regression is easy to
      # attribute.
      next-ecosystem:
        patterns:
          - 'next'
          - 'next-*'
          - 'react'
          - 'react-*'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'typescript'
      tailwind-ecosystem:
        patterns:
          - 'tailwindcss'
          - 'tailwindcss-*'
          - 'postcss'
          - 'autoprefixer'
          - 'prettier-plugin-tailwindcss'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@playwright/*'
          - 'playwright'
          - '@testing-library/*'

  # ----------------------------------------------------------------------------
  # GitHub Actions
  # ----------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: 'Asia/Kolkata'
    open-pull-requests-limit: 5
    target-branch: main
    labels:
      - github_actions
      - 'type: maintenance'
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'

  # Docker (Supabase local development images) — re-add this block in the same
  # PR that introduces supabase/config.toml (Phase 2). It is omitted here
  # because Dependabot logs a silent error each week when the target directory
  # does not exist, and it may not auto-reactivate when the directory is later
  # created.
